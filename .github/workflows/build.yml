name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish a release for, e.g. v0.1.0. Leave empty to only build.'
        required: false
        default: ''

# A release run is a pushed version tag, or a manual run naming a version.
# Repeated rather than shared because Actions has no way to name an expression.
env:
  FLUTTER_SDK_VERSION: '3.47.4'

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android-debug:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    needs: check
    # A release run builds a release APK instead, so this would be eight
    # minutes of runner time producing something nobody installs.
    if: "!(startsWith(github.ref, 'refs/tags/') || inputs.version != '')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter pub get
      # A plugin builds native code through JNI, so Gradle installs
      # cmake;3.22.1 itself during the build. That has worked on every release
      # but one, where the download arrived corrupt and failed the build four
      # minutes in. Warming it here makes that retryable — but only as a
      # courtesy: if this cannot do it, Gradle still tries as before, so the
      # step warns rather than failing and never becomes a new way to break
      # the build.
      - name: Pre-install the native build's CMake
        continue-on-error: true
        run: |
          set -uo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$manager" ] || manager="$(command -v sdkmanager || true)"

          if [ -z "$manager" ] || [ ! -x "$manager" ]; then
            echo "::warning::No sdkmanager found; leaving CMake to Gradle"
            exit 0
          fi

          for attempt in 1 2 3; do
            # Output is deliberately not silenced: the first version of this
            # step hid the reason it was failing.
            if printf 'y\n' | "$manager" 'cmake;3.22.1'; then
              echo "CMake ready after attempt $attempt"
              exit 0
            fi
            echo "::warning::sdkmanager attempt $attempt failed"
            rm -rf "$sdk/cmake/3.22.1"
            sleep $((attempt * 5))
          done

          echo "::warning::Could not pre-install CMake; leaving it to Gradle"

      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: actionnotes-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  android-release:
    name: Android APK (release)
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    env:
      # Read at job level so the signing step's `if` can see whether the
      # keystore secret is configured.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter pub get

      # A plugin builds native code through JNI, so Gradle installs
      # cmake;3.22.1 itself during the build. That has worked on every release
      # but one, where the download arrived corrupt and failed the build four
      # minutes in. Warming it here makes that retryable — but only as a
      # courtesy: if this cannot do it, Gradle still tries as before, so the
      # step warns rather than failing and never becomes a new way to break
      # the build.
      - name: Pre-install the native build's CMake
        continue-on-error: true
        run: |
          set -uo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$manager" ] || manager="$(command -v sdkmanager || true)"

          if [ -z "$manager" ] || [ ! -x "$manager" ]; then
            echo "::warning::No sdkmanager found; leaving CMake to Gradle"
            exit 0
          fi

          for attempt in 1 2 3; do
            # Output is deliberately not silenced: the first version of this
            # step hid the reason it was failing.
            if printf 'y\n' | "$manager" 'cmake;3.22.1'; then
              echo "CMake ready after attempt $attempt"
              exit 0
            fi
            echo "::warning::sdkmanager attempt $attempt failed"
            rm -rf "$sdk/cmake/3.22.1"
            sleep $((attempt * 5))
          done

          echo "::warning::Could not pre-install CMake; leaving it to Gradle"

      - name: Set up release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          # storeFile resolves relative to the app module directory.
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter build apk --release

      - name: Record whether it was signed
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          mv build/app/outputs/flutter-apk/app-release.apk "actionnotes-$TAG.apk"
          # The publish job cannot see this job's secrets context, so pass the
          # answer along with the artifact.
          test -f android/key.properties && echo signed > signing.txt || echo debug > signing.txt

      - uses: actions/upload-artifact@v4
        with:
          name: actionnotes-release-apk
          path: |
            actionnotes-*.apk
            signing.txt
          if-no-files-found: error

  windows:
    name: Windows build
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The runner's Visual Studio is what picks the CMake generator; when
      # Flutter cannot see it, it silently falls back to a VS 2019 generator
      # that is not installed. Print what Flutter found so a failure here is
      # diagnosable from the log alone.
      - name: Report toolchain
        run: flutter doctor -v
      - run: flutter build windows --release

      # One file to carry about, as well as the folder. A Flutter build is an
      # exe plus its DLLs and data/, and the engine loads those from disk, so
      # a true single binary is not on the table — this wraps the folder in an
      # executable that unpacks it once and runs it.
      #
      # NSIS is installed rather than assumed: the image has neither it nor a
      # 7-Zip SFX module that can launch a program, which is how the first two
      # attempts at this went wrong.
      - name: Install NSIS
        continue-on-error: true
        run: choco install nsis --no-progress -y

      - name: Build the single-file portable
        id: portable
        shell: pwsh
        # The zip is the release; this is a convenience. A failure here says
        # so in the log and leaves the asset off, rather than taking the
        # release with it.
        continue-on-error: true
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'actionnotes-portable.exe'

          try {
            $makensis = (Get-Command makensis -ErrorAction SilentlyContinue)?.Source
            foreach ($guess in @(
              'C:\Program Files (x86)\NSIS\makensis.exe',
              'C:\Program Files\NSIS\makensis.exe'
            )) {
              if (-not $makensis -and (Test-Path $guess)) { $makensis = $guess }
            }
            if (-not $makensis) { throw 'NSIS is not installed on this runner' }

            $source = (Resolve-Path 'build/windows/x64/runner/Release').Path
            $version = ($env:TAG -replace '[^A-Za-z0-9._-]', '-')
            $target = Join-Path (Get-Location).Path $out
            Write-Host "Writing $target"
            & $makensis "/DVERSION=$version" "/DSOURCE=$source" "/DOUT=$target" `
              windows/portable.nsi
            if ($LASTEXITCODE -ne 0) { throw "makensis exited $LASTEXITCODE" }

            # It has to be an executable, not whatever fell out of the build:
            # the first version of this step shipped a bare archive named
            # .exe, and nothing checked.
            if (-not (Test-Path $out)) { throw 'makensis produced nothing' }
            $head = [IO.File]::ReadAllBytes($out)[0..1]
            if ([char]$head[0] -ne 'M' -or [char]$head[1] -ne 'Z') {
              throw 'The portable build is not a Windows executable'
            }
            $size = [math]::Round((Get-Item $out).Length / 1MB, 1)
            if ($size -lt 5) { throw "The portable build is only $size MB" }
            Write-Host "Portable build: $size MB, a real PE that launches the app"
          } catch {
            # Leave nothing behind for the upload to find, so a half-made file
            # cannot reach a release.
            if (Test-Path $out) { Remove-Item $out -Force }
            Write-Host "::warning::No portable build: $_"
            throw
          }

      - uses: actions/upload-artifact@v4
        with:
          name: actionnotes-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: hashFiles('actionnotes-portable.exe') != ''
        with:
          name: actionnotes-portable
          path: actionnotes-portable.exe
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    # Both builds run in parallel; this only collects and publishes them, so
    # the slowest build sets the pace rather than the two in series.
    needs: [android-release, windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: actionnotes-release-apk
          path: apk

      - uses: actions/download-artifact@v4
        with:
          name: actionnotes-windows
          path: windows-build

      # Best effort: a release is still a release without it.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: actionnotes-portable
          path: portable

      - name: Package the builds
        id: package
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          # actionnotes.exe needs its DLLs and data/ directory beside it, so
          # ship the whole folder rather than the executable on its own.
          test -f windows-build/actionnotes.exe
          (cd windows-build && zip -qr "../actionnotes-$TAG-windows.zip" .)
          mv "apk/actionnotes-$TAG.apk" .
          echo "signing=$(cat apk/signing.txt)" >> "$GITHUB_OUTPUT"

          # The single-file portable, when the Windows job made one. Checked
          # here as well as there, because a release is public the moment it
          # is created and an asset that is not an executable is worse than a
          # missing one.
          portable=portable/actionnotes-portable.exe
          if [ -f "$portable" ] && [ "$(head -c 2 "$portable")" = "MZ" ]; then
            mv "$portable" "actionnotes-$TAG-portable.exe"
            echo "portable=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No usable portable build; releasing without it"
            echo "portable=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version || github.ref_name }}
          SIGNING: ${{ steps.package.outputs.signing }}
          PORTABLE: ${{ steps.package.outputs.portable }}
        run: |
          set -euo pipefail
          if [ "$SIGNING" = "signed" ]; then
            signing_note="Signed with the project's upload key, so it installs over a previous release."
          else
            signing_note="**Debug-signed.** No release keystore is configured, and CI generates a fresh debug key each run, so this APK will not install over another build — uninstall the old one first. See the README to set up signing."
          fi

          extra_assets=()
          portable_note=""
          if [ "$PORTABLE" = "yes" ]; then
            extra_assets+=("actionnotes-$TAG-portable.exe")
            portable_note="**Windows, one file** — \`actionnotes-$TAG-portable.exe\`

          The same build wrapped in one executable, for carrying about. A
          Flutter app cannot be a single binary — the engine loads its DLLs
          and \`data\` from disk — so this unpacks the folder to
          \`%LOCALAPPDATA%\\ActionNotes\\$TAG\` the first time you run it and
          starts it from there; after that it opens straight away. It is
          per-user and never asks for admin. Some antivirus dislikes a
          program that unpacks and launches another; the zip above is the one
          to use if yours objects."
          fi
          cat > notes.md <<EOF
          ActionNotes $TAG.

          **Android** — \`actionnotes-$TAG.apk\`

          Download it on your phone, open it, and allow installation from
          unknown sources when prompted.

          $signing_note

          **Windows** — \`actionnotes-$TAG-windows.zip\`

          Unzip anywhere and run \`actionnotes.exe\`. There is no installer:
          it runs in place and needs no admin rights, but keep the unzipped
          files together — the executable needs the DLLs and \`data\` folder
          beside it. Windows may warn about an unrecognised app, as the build
          is not code-signed.

          $portable_note
          EOF
          # --repo because this job checks nothing out, so gh has no git
          # remote to infer the repository from.
          # --target matters on a manual run, where the tag does not exist yet
          # and would otherwise be created at the default branch's head.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ActionNotes $TAG" \
            --notes-file notes.md \
            "actionnotes-$TAG.apk" \
            "actionnotes-$TAG-windows.zip" \
            "${extra_assets[@]}"
