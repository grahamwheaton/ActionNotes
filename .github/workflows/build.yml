name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish a release for, e.g. v0.1.0. Leave empty to only build.'
        required: false
        default: ''

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: check
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: actionnotes-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  windows:
    name: Windows build
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      # The runner's Visual Studio is what picks the CMake generator; when
      # Flutter cannot see it, it silently falls back to a VS 2019 generator
      # that is not installed. Print what Flutter found so a failure here is
      # diagnosable from the log alone.
      - name: Report toolchain
        run: flutter doctor -v
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: actionnotes-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    # The Windows build happens on a Windows runner, so this job takes it as an
    # artifact rather than building it here.
    needs: [check, windows]
    # Either a pushed version tag, or a manual run that names a version. The
    # manual path exists because pushing a tag needs push access to the repo,
    # which a release-from-CI flow otherwise makes a prerequisite.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    permissions:
      contents: write
    env:
      # Read at job level so the signing step's `if` can see whether the
      # keystore secret is configured.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Resolve the version
        id: version
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up release signing
        id: signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          # storeFile resolves relative to the app module directory.
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - run: flutter build apk --release

      - name: Name the APK after the version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mv build/app/outputs/flutter-apk/app-release.apk "actionnotes-$TAG.apk"

      - name: Fetch the Windows build
        uses: actions/download-artifact@v4
        with:
          name: actionnotes-windows
          path: windows-build

      - name: Package the Windows build
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # actionnotes.exe needs its DLLs and data/ directory beside it, so
          # ship the whole folder rather than the executable on its own.
          test -f windows-build/actionnotes.exe
          (cd windows-build && zip -qr "../actionnotes-$TAG-windows.zip" .)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = "true" ]; then
            signing_note="Signed with the project's upload key, so it installs over a previous release."
          else
            signing_note="**Debug-signed.** No release keystore is configured, and CI generates a fresh debug key each run, so this APK will not install over another build — uninstall the old one first. See the README to set up signing."
          fi
          cat > notes.md <<EOF
          ActionNotes $TAG.

          **Android** — \`actionnotes-$TAG.apk\`

          Download it on your phone, open it, and allow installation from
          unknown sources when prompted.

          $signing_note

          **Windows** — \`actionnotes-$TAG-windows.zip\`

          Unzip anywhere and run \`actionnotes.exe\`. There is no installer:
          it runs in place and needs no admin rights, but keep the unzipped
          files together — the executable needs the DLLs and \`data\` folder
          beside it. Windows may warn about an unrecognised app, as the build
          is not code-signed.
          EOF
          # --target matters on a manual run, where the tag does not exist yet
          # and would otherwise be created at the default branch's head.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "ActionNotes $TAG" \
            --notes-file notes.md \
            "actionnotes-$TAG.apk" \
            "actionnotes-$TAG-windows.zip"
