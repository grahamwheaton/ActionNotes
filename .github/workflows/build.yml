name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish a release for, e.g. v0.1.0. Leave empty to only build.'
        required: false
        default: ''

# A release run is a pushed version tag, or a manual run naming a version.
# Repeated rather than shared because Actions has no way to name an expression.
env:
  FLUTTER_SDK_VERSION: '3.47.4'

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android-debug:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    needs: check
    # A release run builds a release APK instead, so this would be eight
    # minutes of runner time producing something nobody installs.
    if: "!(startsWith(github.ref, 'refs/tags/') || inputs.version != '')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter pub get
      # A plugin builds native code through JNI, so Gradle downloads CMake
      # mid-build. That download arrived corrupt once and failed the release
      # four minutes in, so install it up front where a bad download can be
      # retried instead of taking the build down with it.
      - name: Install the CMake the native build needs
        run: |
          set -uo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            if yes | "$sdkmanager" 'cmake;3.22.1' >/dev/null 2>&1; then
              echo "CMake installed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed; clearing any partial download"
            rm -rf "$ANDROID_HOME/cmake/3.22.1" "$HOME/.android/cache"
            sleep $((attempt * 5))
          done
          echo 'Could not install cmake;3.22.1' >&2
          exit 1

      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: actionnotes-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  android-release:
    name: Android APK (release)
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    env:
      # Read at job level so the signing step's `if` can see whether the
      # keystore secret is configured.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter pub get

      # A plugin builds native code through JNI, so Gradle downloads CMake
      # mid-build. That download arrived corrupt once and failed the release
      # four minutes in, so install it up front where a bad download can be
      # retried instead of taking the build down with it.
      - name: Install the CMake the native build needs
        run: |
          set -uo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            if yes | "$sdkmanager" 'cmake;3.22.1' >/dev/null 2>&1; then
              echo "CMake installed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed; clearing any partial download"
            rm -rf "$ANDROID_HOME/cmake/3.22.1" "$HOME/.android/cache"
            sleep $((attempt * 5))
          done
          echo 'Could not install cmake;3.22.1' >&2
          exit 1

      - name: Set up release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          # storeFile resolves relative to the app module directory.
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter build apk --release

      - name: Record whether it was signed
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          mv build/app/outputs/flutter-apk/app-release.apk "actionnotes-$TAG.apk"
          # The publish job cannot see this job's secrets context, so pass the
          # answer along with the artifact.
          test -f android/key.properties && echo signed > signing.txt || echo debug > signing.txt

      - uses: actions/upload-artifact@v4
        with:
          name: actionnotes-release-apk
          path: |
            actionnotes-*.apk
            signing.txt
          if-no-files-found: error

  windows:
    name: Windows build
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_SDK_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The runner's Visual Studio is what picks the CMake generator; when
      # Flutter cannot see it, it silently falls back to a VS 2019 generator
      # that is not installed. Print what Flutter found so a failure here is
      # diagnosable from the log alone.
      - name: Report toolchain
        run: flutter doctor -v
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: actionnotes-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    # Both builds run in parallel; this only collects and publishes them, so
    # the slowest build sets the pace rather than the two in series.
    needs: [android-release, windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: actionnotes-release-apk
          path: apk

      - uses: actions/download-artifact@v4
        with:
          name: actionnotes-windows
          path: windows-build

      - name: Package the builds
        id: package
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          # actionnotes.exe needs its DLLs and data/ directory beside it, so
          # ship the whole folder rather than the executable on its own.
          test -f windows-build/actionnotes.exe
          (cd windows-build && zip -qr "../actionnotes-$TAG-windows.zip" .)
          mv "apk/actionnotes-$TAG.apk" .
          echo "signing=$(cat apk/signing.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version || github.ref_name }}
          SIGNING: ${{ steps.package.outputs.signing }}
        run: |
          set -euo pipefail
          if [ "$SIGNING" = "signed" ]; then
            signing_note="Signed with the project's upload key, so it installs over a previous release."
          else
            signing_note="**Debug-signed.** No release keystore is configured, and CI generates a fresh debug key each run, so this APK will not install over another build — uninstall the old one first. See the README to set up signing."
          fi
          cat > notes.md <<EOF
          ActionNotes $TAG.

          **Android** — \`actionnotes-$TAG.apk\`

          Download it on your phone, open it, and allow installation from
          unknown sources when prompted.

          $signing_note

          **Windows** — \`actionnotes-$TAG-windows.zip\`

          Unzip anywhere and run \`actionnotes.exe\`. There is no installer:
          it runs in place and needs no admin rights, but keep the unzipped
          files together — the executable needs the DLLs and \`data\` folder
          beside it. Windows may warn about an unrecognised app, as the build
          is not code-signed.
          EOF
          # --repo because this job checks nothing out, so gh has no git
          # remote to infer the repository from.
          # --target matters on a manual run, where the tag does not exist yet
          # and would otherwise be created at the default branch's head.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ActionNotes $TAG" \
            --notes-file notes.md \
            "actionnotes-$TAG.apk" \
            "actionnotes-$TAG-windows.zip"
